<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>料理Hub - Personal Recipe View</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff8f5; margin: 0; padding: 20px; color: #221a14; }
  .header { max-width: 900px; margin: 0 auto 20px; display: flex; gap: 10px; }
  input { flex: 1; padding: 12px 16px; border: 1px solid #d4c5ba; border-radius: 8px; font-size: 16px; outline: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #f0e3db; }
  .title { font-size: 18px; font-weight: bold; margin: 0 0 6px; }
  .rating { color: #d97706; font-size: 14px; margin-bottom: 8px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag { background: #fbebe1; color: #6c3a07; font-size: 11px; padding: 3px 8px; border-radius: 12px; }
  .links { display: flex; gap: 8px; margin-top: 12px; }
  .btn { text-decoration: none; font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 6px; background: #88511e; color: #fff; }
  .btn.secondary { background: #e29c62; }
</style>
</head>
<body>
  <div class="header">
    <input type="text" id="search" placeholder="料理名やタグで絞り込み..." oninput="filterRecipes()">
  </div>
  <div class="grid" id="container">読み込み中...</div>

<script>
  const API_URL = "ここにGASのウェブアプリURLを貼り付け";
  let allData = JSON.parse(localStorage.getItem("recipe_cache") || "[]");

  function render(list) {
    const el = document.getElementById("container");
    if (!list.length) { el.innerHTML = "<p>該当するレシピがありません</p>"; return; }
    el.innerHTML = list.map(r => `
      <div class="card">
        <div class="title">${r.title}</div>
        <div class="rating">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
        <div class="tags">${r.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
        <div style="font-size: 13px; color: #555;">${r.memo || ""}</div>
        <div class="links">
          ${r.keepUrl ? `<a href="${r.keepUrl}" target="_blank" class="btn">Keep</a>` : ""}
          ${r.videoUrl ? `<a href="${r.videoUrl}" target="_blank" class="btn secondary">動画</a>` : ""}
          ${r.photoUrl ? `<a href="${r.photoUrl}" target="_blank" class="btn secondary">写真</a>` : ""}
        </div>
      </div>
    `).join("");
  }

  function filterRecipes() {
    const q = document.getElementById("search").value.toLowerCase();
    const filtered = allData.filter(r => r.title.toLowerCase().includes(q) || r.tags.some(t => t.toLowerCase().includes(q)));
    render(filtered);
  }

  // 初回キャッシュ表示＆最新データ取得
  render(allData);
  fetch(API_URL).then(res => res.json()).then(data => {
    allData = data;
    localStorage.setItem("recipe_cache", JSON.stringify(data));
    filterRecipes();
  }).catch(console.error);
</script>
</body>
</html>
